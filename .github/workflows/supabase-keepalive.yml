# Keeps the Supabase project (CMS database) from pausing on the free plan:
# reads one row once a day. Uses the public anon key, which the website already ships.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 1 * * *'   # every day, 09:17 Singapore time
  workflow_dispatch: {}     # can also be run by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the content table
        run: |
          KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1c2tsbnF1dG5xZXV1ZHRldGVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjk5MjUsImV4cCI6MjEwNTgwNTkyNX0.7KsFRzXOeVQijx5rsc_cW344gCsaxogZXZfeB1W8Xtw'
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://lusklnqutnqeuudtetep.supabase.co/rest/v1/content?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered: $code"
          test "$code" = "200"
